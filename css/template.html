<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cointainer{
            grid-template-coloum:1fr 3fr;
            grid-template-roes: 50px 200px 100px 50px;
        }
        .header{
            background-color:antiquewhite;
            grid-coloum-start: 1;
            grid-coloum-end:3;
        }
        sidebar{
            background-color:blanchedalmond;
            grid-coloum-start:1;
            grid-coloum-end:2;
            grid-row-start:3;
            grid-row-end: 4;
        }
        .content{
            background-color: black;
            grid-coloum:2/3;
            grid-row: 2/4;
        }
        .footer{
            background-color: brown;
            grid-column: 1/3;
        }
    </style>
</head>
<body>
    <div class=container>
        <header class="header"></header>
        <aside class="slidebar"></aside>
        <main class="content"></main>
        <footer class="footer"></footer>
    </div>
</body>
</html>
